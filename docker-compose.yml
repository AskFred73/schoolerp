services:
  postgres:
    image: postgres:16-alpine
    container_name: schoolerp-postgres
    environment:
      POSTGRES_USER: schoolerp
      POSTGRES_PASSWORD: schoolerp_dev
      POSTGRES_DB: school_erp
    ports:
      - "5432:5432"
    volumes:
      - schoolerp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolerp -d school_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: schoolerp-pgadmin
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@school.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  schoolerp_pgdata:
